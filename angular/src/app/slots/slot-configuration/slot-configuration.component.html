<div class="slot-config-card card shadow-sm">
  <div class="card-header">
    <h5 class="card-title mb-0">
      <i class="bi bi-calendar-plus me-2"></i>Generate Slots
    </h5>
  </div>

  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="row g-3">

        <!-- Start Date -->
        <div class="col-md-6">
          <label for="startDate" class="form-label fw-semibold">
            Start Date <span class="text-danger">*</span>
          </label>
          <input
            id="startDate"
            type="date"
            class="form-control"
            formControlName="startDate"
            [class.is-invalid]="startDate.invalid && startDate.touched"
          />
          <div class="invalid-feedback" *ngIf="startDate.errors?.['required']">
            Start date is required.
          </div>
        </div>

        <!-- End Date -->
        <div class="col-md-6">
          <label for="endDate" class="form-label fw-semibold">
            End Date <span class="text-danger">*</span>
          </label>
          <input
            id="endDate"
            type="date"
            class="form-control"
            formControlName="endDate"
            [class.is-invalid]="(endDate.invalid && endDate.touched) || hasDateRangeError"
          />
          <div class="invalid-feedback" *ngIf="endDate.errors?.['required']">
            End date is required.
          </div>
          <div class="invalid-feedback" *ngIf="hasDateRangeError">
            End date must be on or after start date.
          </div>
        </div>

        <!-- Time Zone -->
        <div class="col-md-6">
          <label for="timeZone" class="form-label fw-semibold">
            Time Zone <span class="text-danger">*</span>
          </label>
          <select
            id="timeZone"
            class="form-select"
            formControlName="timeZone"
            [class.is-invalid]="timeZone.invalid && timeZone.touched"
          >
            <option value="" disabled>Select a time zone</option>
            <option *ngFor="let tz of timeZones" [value]="tz">{{ tz }}</option>
          </select>
          <div class="invalid-feedback">Please select a time zone.</div>
        </div>

        <!-- Slot Duration -->
        <div class="col-md-6">
          <label for="slotDuration" class="form-label fw-semibold">
            Slot Duration (minutes) <span class="text-danger">*</span>
          </label>
          <input
            id="slotDuration"
            type="number"
            class="form-control"
            formControlName="slotDuration"
            min="1"
            [class.is-invalid]="slotDuration.invalid && slotDuration.touched"
          />
          <div class="invalid-feedback" *ngIf="slotDuration.errors?.['required']">
            Slot duration is required.
          </div>
          <div class="invalid-feedback" *ngIf="slotDuration.errors?.['min']">
            Slot duration must be at least 1 minute.
          </div>
        </div>

      </div>

      <!-- Submit -->
      <div class="mt-4 d-flex align-items-center gap-3">
        <button
          id="generateSlotsBtn"
          type="submit"
          class="btn btn-primary"
          [disabled]="isLoading"
        >
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          <i *ngIf="!isLoading" class="bi bi-lightning-charge me-2"></i>
          {{ isLoading ? 'Generating...' : 'Generate Slots' }}
        </button>
      </div>
    </form>

    <!-- Success Alert -->
    <div *ngIf="result" class="alert alert-success d-flex align-items-center mt-4" role="alert">
      <i class="bi bi-check-circle-fill me-2 fs-5"></i>
      <div>
        Successfully generated <strong>{{ result.totalSlotsCreated }}</strong> slot(s).
      </div>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center mt-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
      <div>{{ errorMessage }}</div>
    </div>
  </div>
</div>
